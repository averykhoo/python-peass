[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "python-peass"
dynamic = ["version", "description"]
authors = [
    { name = "Avery Khoo", email = "avery.khoo@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Analysis"
]
dependencies = [
    "numpy >= 1.21.3",
    "scipy >= 1.7.2",
    "soundfile >= 0.10.0"
]

[project.optional-dependencies]
numba = [
    "numba >= 0.56.0"
]
torch = [
    "torch >= 2.0.0"
]

[project.urls]
Homepage = "https://github.com/averykhoo/python-peass"
Source = "https://github.com/averykhoo/python-peass"
Tracker = "https://github.com/averykhoo/python-peass/issues"

[tool.flit.module]
name = "peass"

[tool.flit.sdist]
exclude = [
    "references/*",
    "tests/*",
    "benchmarks/*",
    "reference/*",
    ".github/*"
]

[tool.pytest.ini_options]
# Defaults, plus `benchmarks`: the measurement harness holds no tests, but it does
# hold ~25 MB of result waveforms per captured tag, and nothing there should ever be
# imported or walked by a test run.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "benchmarks"]
markers = [
    "unit: Isolated fast-running tests targeting single modules.",
    "integration: Multi-module system pipeline tests.",
    "regression: Slower validation checks comparing with legacy reference data."
]
