name: Shared Test Template

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      remove-numba: # Dynamic trigger to strip Numba from requirements
        required: false
        type: boolean
        default: false
      remove-torch: # Dynamic trigger to strip PyTorch from requirements
        required: false
        type: boolean
        default: false

jobs:
  run-tests:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          allow-prereleases: true
          cache: 'pip'

      # Dynamically strip Numba from requirements.txt prior to installation
      - name: Drop Numba from requirements
        if: ${{ inputs.remove-numba == true }}
        run: |
          sed -i '/numba/d' requirements.txt
        shell: bash

      # Dynamically strip PyTorch to exercise the pure-NumPy install path
      - name: Drop PyTorch from requirements
        if: ${{ inputs.remove-torch == true }}
        run: |
          sed -i '/torch/d' requirements.txt
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite with coverage
        run: |
          pytest -n auto --cov=peass --cov-report=xml

      - name: Generate Coverage Summary
        if: runner.os == 'Linux'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Write Coverage to Job Summary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY