name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]  # <-- Triggers on every branch push
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dynamically scales the matrix: Full list on main/PRs, only 3.12 on feature branches
        python-version: ${{ (github.ref_name == 'main' || github.event_name == 'pull_request') && fromJSON('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.12"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" != "macOS" ]; then
            pip install numpy scipy --extra-index-url https://urob.github.io/numpy-mkl
          fi
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest -n auto --cov=peass --cov-report=xml

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Write Coverage to Job Summary
        run: |
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish to PyPI
    needs: test
    if: github.event.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write  # Crucial: required for PyPI OIDC Trusted Publishing
      contents: read   # Required to check out repository code

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distribution (sdist and wheel)
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1