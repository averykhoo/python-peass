name: Main Branch Tests

on:
  push:
    branches: [ "main" ]

# Cancel any active, outdated runs on the same branch
concurrency:
  group: main-test-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  post-merge-check:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.14" ]
        remove-numba: [ true, false ]

    uses: ./.github/workflows/template-test.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      remove-numba: ${{ matrix.remove-numba }}
      # Post-merge runs the oracle on both numba legs: a numba kernel diverging from
      # the reference is exactly what it exists to catch, and nothing is blocked by
      # a red main the way a contributor is blocked by a red PR.
      run-oracle: true