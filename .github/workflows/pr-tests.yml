name: Pull Request Tests

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# Cancel running workflows on the same PR when new commits are pushed
concurrency:
  group: pr-test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: true
      matrix:
        # Standard PR verification
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.12", "3.14" ]
        remove-numba: [ false ]
        include:
          # Numba-free verification
          - os: ubuntu-latest
            python-version: "3.14"
            remove-numba: true
          # Windows verification
          - os: windows-latest
            python-version: "3.14"
            remove-numba: false

    uses: ./.github/workflows/template-test.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      remove-numba: ${{ matrix.remove-numba }}
      # Exactly one leg of the matrix, never all of them. hypothesis draws its own
      # seeds here (no derandomize), so a run can go red for a latent bug the PR did
      # not introduce; with `fail-fast: true` above, spreading that across five jobs
      # would multiply the chance of one flake cancelling the whole matrix. This
      # expression matches only the base ubuntu/3.14/numba combination.
      run-oracle: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && !matrix.remove-numba }}